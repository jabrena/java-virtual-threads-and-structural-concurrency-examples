name: fruit-store-frameworks

services:
  postgresql:
    image: postgres:17
    container_name: fruit-store-postgresql
    environment:
      POSTGRES_DB: fruits
      POSTGRES_USER: fruits
      POSTGRES_PASSWORD: fruits
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fruits -d fruits"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  spring-boot:
    image: maven:3.9.11-eclipse-temurin-25
    container_name: fruit-store-spring-boot
    working_dir: /workspace/frameworks/spring-boot
    command: ["./mvnw", "spring-boot:run", "-Dspring-boot.run.jvmArguments=-XX:+UseParallelGC"]
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/fruits
      SPRING_DATASOURCE_USERNAME: fruits
      SPRING_DATASOURCE_PASSWORD: fruits
    ports:
      - "8080:8080"
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - ..:/workspace
      - maven-cache:/root/.m2

  quarkus:
    image: maven:3.9.11-eclipse-temurin-25
    container_name: fruit-store-quarkus
    working_dir: /workspace/frameworks/quarkus
    command: ["./mvnw", "quarkus:dev", "-Ddebug=false", "-Dquarkus.http.host=0.0.0.0"]
    environment:
      QUARKUS_HTTP_PORT: 8081
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgresql:5432/fruits
      QUARKUS_DATASOURCE_USERNAME: fruits
      QUARKUS_DATASOURCE_PASSWORD: fruits
      QUARKUS_OTEL_SDK_DISABLED: "true"
    ports:
      - "8081:8081"
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - ..:/workspace
      - maven-cache:/root/.m2

  micronaut:
    image: maven:3.9.11-eclipse-temurin-25
    container_name: fruit-store-micronaut
    working_dir: /workspace/frameworks/micronaut
    command: ["./mvnw", "mn:run"]
    environment:
      MICRONAUT_SERVER_PORT: 8082
      DATASOURCES_DEFAULT_URL: jdbc:postgresql://postgresql:5432/fruits
      DATASOURCES_DEFAULT_USERNAME: fruits
      DATASOURCES_DEFAULT_PASSWORD: fruits
      OTEL_SDK_DISABLED: "true"
    ports:
      - "8082:8082"
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - ..:/workspace
      - maven-cache:/root/.m2

volumes:
  postgres-data:
  maven-cache:
