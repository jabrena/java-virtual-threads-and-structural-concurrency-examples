name: fruit-store-frameworks

services:
  spring-boot-postgresql:
    image: postgres:17
    container_name: fruit-store-spring-boot-postgresql
    environment:
      POSTGRES_DB: fruits_spring_boot
      POSTGRES_USER: fruits
      POSTGRES_PASSWORD: fruits
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fruits -d fruits_spring_boot"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - spring-boot-postgres-data:/var/lib/postgresql/data

  quarkus-postgresql:
    image: postgres:17
    container_name: fruit-store-quarkus-postgresql
    environment:
      POSTGRES_DB: fruits_quarkus
      POSTGRES_USER: fruits
      POSTGRES_PASSWORD: fruits
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fruits -d fruits_quarkus"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - quarkus-postgres-data:/var/lib/postgresql/data

  micronaut-postgresql:
    image: postgres:17
    container_name: fruit-store-micronaut-postgresql
    environment:
      POSTGRES_DB: fruits_micronaut
      POSTGRES_USER: fruits
      POSTGRES_PASSWORD: fruits
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fruits -d fruits_micronaut"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - micronaut-postgres-data:/var/lib/postgresql/data

  spring-boot:
    image: maven:3.9.11-eclipse-temurin-25
    container_name: fruit-store-spring-boot
    working_dir: /workspace/frameworks/spring-boot
    command: ["sh", "-lc", "./mvnw -DskipTests package && exec java -XX:+UseParallelGC -jar target/spring-boot-fruit-store-0.0.1-SNAPSHOT.jar"]
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://spring-boot-postgresql:5432/fruits_spring_boot
      SPRING_DATASOURCE_USERNAME: fruits
      SPRING_DATASOURCE_PASSWORD: fruits
    ports:
      - "8080:8080"
    depends_on:
      spring-boot-postgresql:
        condition: service_healthy
    volumes:
      - ..:/workspace
      - maven-cache:/root/.m2

  quarkus:
    image: maven:3.9.11-eclipse-temurin-25
    container_name: fruit-store-quarkus
    working_dir: /workspace/frameworks/quarkus
    command: ["sh", "-lc", "./mvnw -DskipTests package && exec java -Dquarkus.http.host=0.0.0.0 -jar target/quarkus-app/quarkus-run.jar"]
    environment:
      QUARKUS_HTTP_PORT: 8081
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://quarkus-postgresql:5432/fruits_quarkus
      QUARKUS_DATASOURCE_USERNAME: fruits
      QUARKUS_DATASOURCE_PASSWORD: fruits
      QUARKUS_OTEL_SDK_DISABLED: "true"
    ports:
      - "8081:8081"
    depends_on:
      quarkus-postgresql:
        condition: service_healthy
    volumes:
      - ..:/workspace
      - maven-cache:/root/.m2

  micronaut:
    image: maven:3.9.11-eclipse-temurin-25
    container_name: fruit-store-micronaut
    working_dir: /workspace/frameworks/micronaut
    command: ["sh", "-lc", "./mvnw -DskipTests package && exec java -jar target/micronaut-fruit-store-0.1.jar"]
    environment:
      MICRONAUT_SERVER_PORT: 8082
      DATASOURCES_DEFAULT_URL: jdbc:postgresql://micronaut-postgresql:5432/fruits_micronaut
      DATASOURCES_DEFAULT_USERNAME: fruits
      DATASOURCES_DEFAULT_PASSWORD: fruits
      OTEL_SDK_DISABLED: "true"
    ports:
      - "8082:8082"
    depends_on:
      micronaut-postgresql:
        condition: service_healthy
    volumes:
      - ..:/workspace
      - maven-cache:/root/.m2

volumes:
  spring-boot-postgres-data:
  quarkus-postgres-data:
  micronaut-postgres-data:
  maven-cache:
