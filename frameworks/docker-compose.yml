name: fruit-store-frameworks

services:
  spring-boot-postgresql:
    image: postgres:17
    container_name: fruit-store-spring-boot-postgresql
    environment:
      POSTGRES_DB: fruits_spring_boot
      POSTGRES_USER: fruits
      POSTGRES_PASSWORD: fruits
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fruits -d fruits_spring_boot"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - spring-boot-postgres-data:/var/lib/postgresql/data

  quarkus-postgresql:
    image: postgres:17
    container_name: fruit-store-quarkus-postgresql
    environment:
      POSTGRES_DB: fruits_quarkus
      POSTGRES_USER: fruits
      POSTGRES_PASSWORD: fruits
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fruits -d fruits_quarkus"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - quarkus-postgres-data:/var/lib/postgresql/data

  micronaut-postgresql:
    image: postgres:17
    container_name: fruit-store-micronaut-postgresql
    environment:
      POSTGRES_DB: fruits_micronaut
      POSTGRES_USER: fruits
      POSTGRES_PASSWORD: fruits
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fruits -d fruits_micronaut"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - micronaut-postgres-data:/var/lib/postgresql/data

  spring-boot:
    image: maven:3.9.11-eclipse-temurin-25
    container_name: fruit-store-spring-boot
    working_dir: /workspace/frameworks/spring-boot
    command: ["sh", "-lc", "./mvnw -DskipTests package && exec java -XX:+UseCompactObjectHeaders -XX:+UseParallelGC -jar target/spring-boot-fruit-store-0.0.1-SNAPSHOT.jar"]
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://spring-boot-postgresql:5432/fruits_spring_boot
      SPRING_DATASOURCE_USERNAME: fruits
      SPRING_DATASOURCE_PASSWORD: fruits
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8080:8080"
    depends_on:
      spring-boot-postgresql:
        condition: service_healthy
      otel-collector:
        condition: service_started
    volumes:
      - ..:/workspace
      - maven-cache:/root/.m2

  quarkus:
    image: maven:3.9.11-eclipse-temurin-25
    container_name: fruit-store-quarkus
    working_dir: /workspace/frameworks/quarkus
    command: ["sh", "-lc", "./mvnw -DskipTests package && exec java -XX:+UseCompactObjectHeaders -Dquarkus.http.host=0.0.0.0 -jar target/quarkus-app/quarkus-run.jar"]
    environment:
      QUARKUS_HTTP_PORT: 8081
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://quarkus-postgresql:5432/fruits_quarkus
      QUARKUS_DATASOURCE_USERNAME: fruits
      QUARKUS_DATASOURCE_PASSWORD: fruits
      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8081:8081"
    depends_on:
      quarkus-postgresql:
        condition: service_healthy
      otel-collector:
        condition: service_started
    volumes:
      - ..:/workspace
      - maven-cache:/root/.m2

  micronaut:
    image: maven:3.9.11-eclipse-temurin-25
    container_name: fruit-store-micronaut
    working_dir: /workspace/frameworks/micronaut
    command: ["sh", "-lc", "./mvnw -DskipTests package && exec java -XX:+UseCompactObjectHeaders -jar target/micronaut-fruit-store-0.1.jar"]
    environment:
      MICRONAUT_SERVER_PORT: 8082
      DATASOURCES_DEFAULT_URL: jdbc:postgresql://micronaut-postgresql:5432/fruits_micronaut
      DATASOURCES_DEFAULT_USERNAME: fruits
      DATASOURCES_DEFAULT_PASSWORD: fruits
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8082:8082"
    depends_on:
      micronaut-postgresql:
        condition: service_healthy
      otel-collector:
        condition: service_started
    volumes:
      - ..:/workspace
      - maven-cache:/root/.m2

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    container_name: fruit-store-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./_observability/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      tempo:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: fruit-store-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./_observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      spring-boot:
        condition: service_started
      quarkus:
        condition: service_started
      micronaut:
        condition: service_started

  pyroscope:
    image: grafana/pyroscope:1.13.6
    container_name: fruit-store-pyroscope
    ports:
      - "4040:4040"
    volumes:
      - pyroscope-data:/var/lib/pyroscope

  alloy:
    image: grafana/alloy:v1.14.0
    container_name: fruit-store-alloy
    user: "0"
    pid: host
    privileged: true
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "/etc/alloy/config.alloy"
    volumes:
      - ./_observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "12345:12345"
    depends_on:
      pyroscope:
        condition: service_started
      spring-boot:
        condition: service_started
      quarkus:
        condition: service_started
      micronaut:
        condition: service_started

  tempo:
    image: grafana/tempo:2.8.1
    container_name: fruit-store-tempo
    user: "0"
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./_observability/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/tmp/tempo
    ports:
      - "3200:3200"

  grafana:
    image: grafana/grafana:12.0.1
    container_name: fruit-store-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./_observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
      pyroscope:
        condition: service_started

volumes:
  spring-boot-postgres-data:
  quarkus-postgres-data:
  micronaut-postgres-data:
  maven-cache:
  prometheus-data:
  tempo-data:
  grafana-data:
  pyroscope-data:
