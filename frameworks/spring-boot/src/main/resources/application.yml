spring:
  application:
    name: spring-boot-fruit-store
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_empty
  datasource:
    url: jdbc:postgresql://localhost:5432/fruits
    username: fruits
    password: fruits
    hikari:
      maximum-pool-size: 50
  sql:
    init:
      mode: always
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          fetch_size: 16
        default_batch_fetch_size: 16

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 0.1
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
